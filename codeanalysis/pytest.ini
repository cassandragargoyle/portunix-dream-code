[pytest]
testpaths = test
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

markers =
    quick: Quick tests for development
    slow: Slow tests that take time
    integration: Integration tests requiring bridges
    codescan: Tests for CodeScan bridge
    sonarlint: Tests for SonarLint bridge

# Default options
addopts = --tb=short
