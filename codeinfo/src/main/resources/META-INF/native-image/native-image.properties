# GraalVM Native Image configuration for ptx-codeinfo

# Build arguments
# MaxNewSize keeps the young generation small: the default lets peak memory grow
# above 50 MB on large files, 8 MB keeps it near 35 MB with little time cost
Args = --no-fallback \
       --report-unsupported-elements-at-runtime \
       -H:+ReportExceptionStackTraces \
       --initialize-at-build-time=picocli \
       -R:MaxNewSize=8m
