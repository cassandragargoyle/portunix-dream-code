# SPDX-License-Identifier: MIT
# Basic checks for pull requests and pushes to main (issue #10)
# Scope and manual checks: see TESTING.md, section "Continuous Integration"
name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  # Cancel outdated PR runs only; every commit on main keeps its result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Batch mode, no download progress in logs (Maven 3.9+)
  MAVEN_ARGS: -B -ntp

jobs:
  java:
    name: Java (codeinfo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # Own cache key per job, both Java jobs would share one otherwise
          cache-dependency-path: |
            pom.xml
            codeinfo/pom.xml

      - name: Build
        run: make build-java

      - name: Test
        run: make test-java

  go:
    name: Go (codeanalysis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: codeanalysis/go.mod
          cache-dependency-path: codeanalysis/go.sum

      - name: Vet, build and test
        run: make test-go

  bridge:
    name: Java bridges (SonarLint, CodeScan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            codeanalysis/bridges/sonarlint/pom.xml
            codeanalysis/bridges/codescan/pom.xml

      - name: Build and test
        run: make -C codeanalysis/bridges build test

  python:
    name: Python quick tests (codeanalysis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Missing bridge or Java fails the tests instead of skipping them
      PTX_REQUIRE_BRIDGES: '1'
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: codeanalysis/bridges/codescan/pom.xml

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Quick tests use the CodeScan bridge only
      - name: Build CodeScan bridge
        run: make -C codeanalysis/bridges build-codescan

      - name: Quick tests
        run: make test-quick
